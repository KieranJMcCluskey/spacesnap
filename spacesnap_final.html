<!DOCTYPE html>
<html>
  <head>
    <title>Space Snap</title>
    <style>
      body {
        background-color: #0a0a2e;
        background-image: url('https://images-assets.nasa.gov/image/PIA17563/PIA17563~orig.jpg');
        background-size: cover;
        background-position: center;
        font-family: Arial, sans-serif;
        color: white;
      }

      h1 {
        text-align: center;
        font-size: 48px;
        color: gold;
        text-shadow: 0 0 20px gold;
        margin-top: 20px;
      }

      .scorebar {
        text-align: center;
        font-size: 22px;
        color: lightblue;
        margin-bottom: 5px;
      }

      .game-grid {
        display: grid;
        grid-template-columns: repeat(4, 120px);
        gap: 10px;
        width: 510px;
        margin: 20px auto;
      }

      .card-container {
        width: 120px;
        height: 120px;
        perspective: 600px;
        cursor: pointer;
      }

      .card {
        width: 100%;
        height: 100%;
        position: relative;
        transform-style: preserve-3d;
        transition: transform 0.5s;
        border-radius: 10px;
      }

      .card-container.flipped .card {
        transform: rotateY(180deg);
      }

      .card-back,
      .card-front {
        position: absolute;
        width: 100%;
        height: 100%;
        backface-visibility: hidden;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 2px solid gold;
        box-sizing: border-box;
      }

      .card-back {
        background-color: rgba(0, 0, 80, 0.8);
        font-size: 40px;
      }

      .card-front {
        background-color: rgba(0, 0, 120, 0.9);
        font-size: 60px;
        transform: rotateY(180deg);
      }

      .card-container.matched .card-front {
        background-color: rgba(0, 80, 0, 0.9);
        border-color: lime;
      }

      .win-screen {
        display: none;
        text-align: center;
        margin-top: 20px;
      }

      .win-screen h2 {
        font-size: 40px;
        color: gold;
        text-shadow: 0 0 20px gold;
      }

      .play-again {
        background-color: gold;
        color: #0a0a2e;
        border: none;
        padding: 15px 40px;
        font-size: 20px;
        font-weight: bold;
        border-radius: 10px;
        cursor: pointer;
        margin-top: 10px;
      }

      .play-again:hover {
        background-color: white;
      }
    </style>
  </head>
  <body>
    <h1>🚀 Space Snap 🚀</h1>
    <p class="scorebar">Moves: <span id="moveCount">0</span></p>

    <div class="game-grid" id="gameGrid">
      <div class="card-container" data-symbol="🚀"><div class="card"><div class="card-back">⭐</div><div class="card-front">🚀</div></div></div>
      <div class="card-container" data-symbol="🌙"><div class="card"><div class="card-back">⭐</div><div class="card-front">🌙</div></div></div>
      <div class="card-container" data-symbol="⭐"><div class="card"><div class="card-back">⭐</div><div class="card-front">⭐</div></div></div>
      <div class="card-container" data-symbol="🪐"><div class="card"><div class="card-back">⭐</div><div class="card-front">🪐</div></div></div>
      <div class="card-container" data-symbol="☄️"><div class="card"><div class="card-back">⭐</div><div class="card-front">☄️</div></div></div>
      <div class="card-container" data-symbol="👾"><div class="card"><div class="card-back">⭐</div><div class="card-front">👾</div></div></div>
      <div class="card-container" data-symbol="🛸"><div class="card"><div class="card-back">⭐</div><div class="card-front">🛸</div></div></div>
      <div class="card-container" data-symbol="🌍"><div class="card"><div class="card-back">⭐</div><div class="card-front">🌍</div></div></div>
      <div class="card-container" data-symbol="🚀"><div class="card"><div class="card-back">⭐</div><div class="card-front">🚀</div></div></div>
      <div class="card-container" data-symbol="🌙"><div class="card"><div class="card-back">⭐</div><div class="card-front">🌙</div></div></div>
      <div class="card-container" data-symbol="⭐"><div class="card"><div class="card-back">⭐</div><div class="card-front">⭐</div></div></div>
      <div class="card-container" data-symbol="🪐"><div class="card"><div class="card-back">⭐</div><div class="card-front">🪐</div></div></div>
      <div class="card-container" data-symbol="☄️"><div class="card"><div class="card-back">⭐</div><div class="card-front">☄️</div></div></div>
      <div class="card-container" data-symbol="👾"><div class="card"><div class="card-back">⭐</div><div class="card-front">👾</div></div></div>
      <div class="card-container" data-symbol="🛸"><div class="card"><div class="card-back">⭐</div><div class="card-front">🛸</div></div></div>
      <div class="card-container" data-symbol="🌍"><div class="card"><div class="card-back">⭐</div><div class="card-front">🌍</div></div></div>
    </div>

    <div class="win-screen" id="winScreen">
      <h2>🎉 You found all the pairs! 🎉</h2>
      <p>Amazing work, Space Explorer! You did it in <span id="finalMoves"></span> moves!</p>
      <button class="play-again" onclick="location.reload()">Play Again</button>
    </div>

    <script>
      let firstCard = null;
      let secondCard = null;
      let locked = false;
      let matchesFound = 0;
      let moves = 0;

      // Shuffle the cards
      let grid = document.getElementById('gameGrid');
      let cardList = Array.from(grid.children);
      cardList.sort(function() { return Math.random() - 0.5; });
      cardList.forEach(function(card) { grid.appendChild(card); });

      let cards = document.querySelectorAll('.card-container');

      cards.forEach(function(card) {
        card.addEventListener('click', function() {
          if (locked) return;
          if (card === firstCard) return;
          if (card.classList.contains('matched')) return;

          card.classList.add('flipped');

          if (firstCard === null) {
            firstCard = card;
          } else {
            secondCard = card;
            locked = true;
            moves = moves + 1;
            document.getElementById('moveCount').textContent = moves;

            if (firstCard.dataset.symbol === secondCard.dataset.symbol) {
              firstCard.classList.add('matched');
              secondCard.classList.add('matched');
              matchesFound = matchesFound + 1;
              firstCard = null;
              secondCard = null;
              locked = false;

              if (matchesFound === 8) {
                document.getElementById('finalMoves').textContent = moves;
                document.getElementById('winScreen').style.display = 'block';
              }
            } else {
              setTimeout(function() {
                firstCard.classList.remove('flipped');
                secondCard.classList.remove('flipped');
                firstCard = null;
                secondCard = null;
                locked = false;
              }, 1000);
            }
          }
        });
      });
    </script>

  </body>
</html>
