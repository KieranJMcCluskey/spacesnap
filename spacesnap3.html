<!DOCTYPE html>
<html>
  <head>
    <title>Space Snap</title>
    <style>
      body {
        background-color: #0a0a2e;
        background-image: url('https://images-assets.nasa.gov/image/PIA17563/PIA17563~orig.jpg');
        background-size: cover;
        background-position: center;
        font-family: Arial, sans-serif;
        color: white;
      }

      h1 {
        text-align: center;
        font-size: 48px;
        color: gold;
        text-shadow: 0 0 20px gold;
        margin-top: 20px;
      }

      p {
        text-align: center;
        font-size: 18px;
        color: lightblue;
      }

      .game-grid {
        display: grid;
        grid-template-columns: repeat(4, 120px);
        gap: 10px;
        width: 510px;
        margin: 20px auto;
      }

      .card {
        width: 120px;
        height: 120px;
        background-color: rgba(0, 0, 80, 0.8);
        border: 2px solid gold;
        border-radius: 10px;
      }
    </style>
  </head>
  <body>
    <h1>🚀 Space Snap 🚀</h1>
    <p>Match all the space pairs to win!</p>

    <div class="game-grid">
      <div class="card"></div>
      <div class="card"></div>
      <div class="card"></div>
      <div class="card"></div>
      <div class="card"></div>
      <div class="card"></div>
      <div class="card"></div>
      <div class="card"></div>
      <div class="card"></div>
      <div class="card"></div>
      <div class="card"></div>
      <div class="card"></div>
      <div class="card"></div>
      <div class="card"></div>
      <div class="card"></div>
      <div class="card"></div>
    </div>

  </body>
</html>
