<!DOCTYPE html>
<html>
  <head>
    <title>Space Snap</title>
    <style>
      h1 {
        text-align: center;
      }

      .game-grid {
        display: grid;
        grid-template-columns: repeat(4, 120px);
        gap: 10px;
        width: 510px;
        margin: 20px auto;
      }

      .card {
        width: 120px;
        height: 120px;
        background-color: navy;
        border-radius: 10px;
      }
    </style>
  </head>

    <h1>Space Snap</h1>

    <div class="game-grid">
      <div class="card"></div>
      <div class="card"></div>
      <div class="card"></div>
      <div class="card"></div>
      <div class="card"></div>
      <div class="card"></div>
      <div class="card"></div>
      <div class="card"></div>
      <div class="card"></div>
      <div class="card"></div>
      <div class="card"></div>
      <div class="card"></div>
      <div class="card"></div>
      <div class="card"></div>
      <div class="card"></div>
      <div class="card"></div>
    </div>

  </body>
</html>
