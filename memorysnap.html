<!DOCTYPE html>
<html>
  <head>
    <title>Memory Snap</title>
    <style>
      body {
        background-color: #f5ece0;
        background-image:
          radial-gradient(ellipse at 20% 15%, rgba(255, 225, 170, 0.55) 0%, transparent 50%),
          radial-gradient(ellipse at 80% 85%, rgba(210, 170, 120, 0.45) 0%, transparent 50%),
          radial-gradient(ellipse at 60% 30%, rgba(240, 215, 175, 0.3) 0%, transparent 45%),
          repeating-linear-gradient(
            0deg,
            transparent,
            transparent 39px,
            rgba(180, 140, 90, 0.06) 39px,
            rgba(180, 140, 90, 0.06) 40px
          ),
          repeating-linear-gradient(
            90deg,
            transparent,
            transparent 39px,
            rgba(180, 140, 90, 0.06) 39px,
            rgba(180, 140, 90, 0.06) 40px
          );
        background-attachment: fixed;
        font-family: Georgia, 'Times New Roman', serif;
        color: #3a2a1a;
        min-height: 100vh;
        margin: 0;
        padding-bottom: 2rem;
      }

      h1 {
        text-align: center;
        font-size: 44px;
        color: #6b3d1e;
        text-shadow: 0 2px 6px rgba(107, 61, 30, 0.18);
        margin-top: 24px;
        margin-bottom: 4px;
        letter-spacing: 1px;
      }

      .cafe-tagline {
        text-align: center;
        font-size: 14px;
        color: #a07850;
        letter-spacing: 2px;
        text-transform: uppercase;
        margin-bottom: 4px;
      }

      .scorebar {
        text-align: center;
        font-size: 20px;
        color: #8b5e3c;
        margin-bottom: 5px;
        font-family: Georgia, serif;
      }

      .game-grid {
        display: grid;
        grid-template-columns: repeat(4, 120px);
        gap: 10px;
        width: 510px;
        margin: 20px auto;
      }

      .card-container {
        width: 120px;
        height: 120px;
        perspective: 600px;
        cursor: pointer;
      }

      .card {
        width: 100%;
        height: 100%;
        position: relative;
        transform-style: preserve-3d;
        transition: transform 0.5s;
        border-radius: 10px;
      }

      .card-container.flipped .card {
        transform: rotateY(180deg);
      }

      .card-back,
      .card-front {
        position: absolute;
        width: 100%;
        height: 100%;
        backface-visibility: hidden;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
      }

      .card-back {
        background: linear-gradient(135deg, #e8d5b8 0%, #d4b896 100%);
        border: 2px solid #c4986a;
        font-size: 40px;
        box-shadow: inset 0 1px 3px rgba(255,255,255,0.6), 0 3px 8px rgba(120,80,30,0.2);
      }

      .card-front {
        background: linear-gradient(135deg, #fffaf3 0%, #f8eedd 100%);
        border: 2px solid #c4986a;
        font-size: 60px;
        transform: rotateY(180deg);
        box-shadow: inset 0 1px 3px rgba(255,255,255,0.8), 0 3px 8px rgba(120,80,30,0.2);
      }

      .card-container.matched .card-front {
        background: linear-gradient(135deg, #d4edca 0%, #b8dca8 100%);
        border-color: #6a9e55;
        box-shadow: inset 0 1px 3px rgba(255,255,255,0.6), 0 3px 8px rgba(60,100,40,0.2);
      }

      .win-screen {
        display: none;
        text-align: center;
        margin-top: 24px;
        padding: 2rem;
        background: rgba(255, 248, 235, 0.85);
        border-radius: 16px;
        width: 480px;
        margin-left: auto;
        margin-right: auto;
        border: 1px solid rgba(196, 152, 106, 0.4);
        box-shadow: 0 8px 32px rgba(120, 80, 30, 0.12);
      }

      .win-screen h2 {
        font-size: 36px;
        color: #6b3d1e;
        text-shadow: 0 2px 6px rgba(107, 61, 30, 0.15);
        margin-bottom: 0.5rem;
      }

      .win-screen p {
        color: #8b5e3c;
        font-size: 18px;
        margin-bottom: 1rem;
      }

      .play-again {
        background: linear-gradient(135deg, #8b5e3c, #6b3d1e);
        color: #fff8ee;
        border: none;
        padding: 14px 40px;
        font-size: 18px;
        font-family: Georgia, serif;
        font-weight: bold;
        border-radius: 10px;
        cursor: pointer;
        margin-top: 6px;
        letter-spacing: 1px;
        box-shadow: 0 4px 12px rgba(107, 61, 30, 0.3);
        transition: transform 0.15s, box-shadow 0.15s;
      }

      .play-again:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 18px rgba(107, 61, 30, 0.35);
      }
    </style>
  </head>
  <body>
    <h1>☕ Memory Snap ☕</h1>
    <p class="cafe-tagline">Forget Me No Memory Café</p>
    <p class="scorebar">Moves: <span id="moveCount">0</span></p>

    <div class="game-grid" id="gameGrid">
      <div class="card-container" data-symbol="🔑"><div class="card"><div class="card-back">🌸</div><div class="card-front">🔑</div></div></div>
      <div class="card-container" data-symbol="☕️"><div class="card"><div class="card-back">🌸</div><div class="card-front">☕️</div></div></div>
      <div class="card-container" data-symbol="🌙"><div class="card"><div class="card-back">🌸</div><div class="card-front">🌙</div></div></div>
      <div class="card-container" data-symbol="⚽️"><div class="card"><div class="card-back">🌸</div><div class="card-front">⚽️</div></div></div>
      <div class="card-container" data-symbol="🍰"><div class="card"><div class="card-back">🌸</div><div class="card-front">🍰</div></div></div>
      <div class="card-container" data-symbol="🚗"><div class="card"><div class="card-back">🌸</div><div class="card-front">🚗</div></div></div>
      <div class="card-container" data-symbol="🏠"><div class="card"><div class="card-back">🌸</div><div class="card-front">🏠</div></div></div>
      <div class="card-container" data-symbol="🌍"><div class="card"><div class="card-back">🌸</div><div class="card-front">🌍</div></div></div>
      <div class="card-container" data-symbol="🔑"><div class="card"><div class="card-back">🌸</div><div class="card-front">🔑</div></div></div>
      <div class="card-container" data-symbol="☕️"><div class="card"><div class="card-back">🌸</div><div class="card-front">☕️</div></div></div>
      <div class="card-container" data-symbol="🌙"><div class="card"><div class="card-back">🌸</div><div class="card-front">🌙</div></div></div>
      <div class="card-container" data-symbol="⚽️"><div class="card"><div class="card-back">🌸</div><div class="card-front">⚽️</div></div></div>
      <div class="card-container" data-symbol="🍰"><div class="card"><div class="card-back">🌸</div><div class="card-front">🍰</div></div></div>
      <div class="card-container" data-symbol="🚗"><div class="card"><div class="card-back">🌸</div><div class="card-front">🚗</div></div></div>
      <div class="card-container" data-symbol="🏠"><div class="card"><div class="card-back">🌸</div><div class="card-front">🏠</div></div></div>
      <div class="card-container" data-symbol="🌍"><div class="card"><div class="card-back">🌸</div><div class="card-front">🌍</div></div></div>
    </div>

    <div class="win-screen" id="winScreen">
      <h2>🎉 You found all the pairs! 🎉</h2>
      <p>Amazing work! You did it in <span id="finalMoves"></span> moves!</p>
      <button class="play-again" onclick="location.reload()">Play Again</button>
    </div>

    <script>
      let firstCard = null;
      let secondCard = null;
      let locked = false;
      let matchesFound = 0;
      let moves = 0;

      // Shuffle the cards
      let grid = document.getElementById('gameGrid');
      let cardList = Array.from(grid.children);
      cardList.sort(function() { return Math.random() - 0.5; });
      cardList.forEach(function(card) { grid.appendChild(card); });

      let cards = document.querySelectorAll('.card-container');

      cards.forEach(function(card) {
        card.addEventListener('click', function() {
          if (locked) return;
          if (card === firstCard) return;
          if (card.classList.contains('matched')) return;

          card.classList.add('flipped');

          if (firstCard === null) {
            firstCard = card;
          } else {
            secondCard = card;
            locked = true;
            moves = moves + 1;
            document.getElementById('moveCount').textContent = moves;

            if (firstCard.dataset.symbol === secondCard.dataset.symbol) {
              firstCard.classList.add('matched');
              secondCard.classList.add('matched');
              matchesFound = matchesFound + 1;
              firstCard = null;
              secondCard = null;
              locked = false;

              if (matchesFound === 8) {
                document.getElementById('finalMoves').textContent = moves;
                document.getElementById('winScreen').style.display = 'block';
              }
            } else {
              setTimeout(function() {
                firstCard.classList.remove('flipped');
                secondCard.classList.remove('flipped');
                firstCard = null;
                secondCard = null;
                locked = false;
              }, 2000);
            }
          }
        });
      });
    </script>

  </body>
</html>
