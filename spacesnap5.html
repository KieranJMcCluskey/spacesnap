<!DOCTYPE html>
<html>
  <head>
    <title>Space Snap</title>
    <style>
      body {
        background-color: #0a0a2e;
        background-image: url('https://images-assets.nasa.gov/image/PIA17563/PIA17563~orig.jpg');
        background-size: cover;
        background-position: center;
        font-family: Arial, sans-serif;
        color: white;
      }

      h1 {
        text-align: center;
        font-size: 48px;
        color: gold;
        text-shadow: 0 0 20px gold;
        margin-top: 20px;
      }

      p {
        text-align: center;
        font-size: 18px;
        color: lightblue;
      }

      .game-grid {
        display: grid;
        grid-template-columns: repeat(4, 120px);
        gap: 10px;
        width: 510px;
        margin: 20px auto;
      }

      .card-container {
        width: 120px;
        height: 120px;
        perspective: 600px;
        cursor: pointer;
      }

      .card {
        width: 100%;
        height: 100%;
        position: relative;
        transform-style: preserve-3d;
        transition: transform 0.5s;
        border-radius: 10px;
      }

      .card-back,
      .card-front {
        position: absolute;
        width: 100%;
        height: 100%;
        backface-visibility: hidden;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 2px solid gold;
        box-sizing: border-box;
      }

      .card-back {
        background-color: rgba(0, 0, 80, 0.8);
        font-size: 40px;
      }

      .card-front {
        background-color: rgba(0, 0, 120, 0.9);
        font-size: 60px;
        transform: rotateY(180deg);
      }
    </style>
  </head>
  <body>
    <h1>🚀 Space Snap 🚀</h1>
    <p>Match all the space pairs to win!</p>

    <div class="game-grid">
      <div class="card-container"><div class="card"><div class="card-back">⭐</div><div class="card-front">🚀</div></div></div>
      <div class="card-container"><div class="card"><div class="card-back">⭐</div><div class="card-front">🌙</div></div></div>
      <div class="card-container"><div class="card"><div class="card-back">⭐</div><div class="card-front">⭐</div></div></div>
      <div class="card-container"><div class="card"><div class="card-back">⭐</div><div class="card-front">🪐</div></div></div>
      <div class="card-container"><div class="card"><div class="card-back">⭐</div><div class="card-front">☄️</div></div></div>
      <div class="card-container"><div class="card"><div class="card-back">⭐</div><div class="card-front">👾</div></div></div>
      <div class="card-container"><div class="card"><div class="card-back">⭐</div><div class="card-front">🛸</div></div></div>
      <div class="card-container"><div class="card"><div class="card-back">⭐</div><div class="card-front">🌍</div></div></div>
      <div class="card-container"><div class="card"><div class="card-back">⭐</div><div class="card-front">🚀</div></div></div>
      <div class="card-container"><div class="card"><div class="card-back">⭐</div><div class="card-front">🌙</div></div></div>
      <div class="card-container"><div class="card"><div class="card-back">⭐</div><div class="card-front">⭐</div></div></div>
      <div class="card-container"><div class="card"><div class="card-back">⭐</div><div class="card-front">🪐</div></div></div>
      <div class="card-container"><div class="card"><div class="card-back">⭐</div><div class="card-front">☄️</div></div></div>
      <div class="card-container"><div class="card"><div class="card-back">⭐</div><div class="card-front">👾</div></div></div>
      <div class="card-container"><div class="card"><div class="card-back">⭐</div><div class="card-front">🛸</div></div></div>
      <div class="card-container"><div class="card"><div class="card-back">⭐</div><div class="card-front">🌍</div></div></div>
    </div>

  </body>
</html>
